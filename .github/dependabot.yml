# Dependabot version updates. One entry per dependency manifest in this repo.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# `package-ecosystem` must name a real ecosystem. GitHub's starter file leaves
# it as "", and Dependabot rejects the ENTIRE file when any one entry is
# invalid - so a config in this shape opens no pull requests at all and reports
# that only on the repository's Dependabot page. tests/test_dependabot_config.py
# pins that, pins that every manifest on disk has an entry here, and pins that
# anything tracking more than one dependency is grouped.
#
# `groups` exist because the alternative is one PR per dependency: four
# ecosystems at a limit of 5 is up to 20 open at once on a repo with one
# maintainer. All groups set `applies-to: version-updates`, so a SECURITY
# update still arrives as its own PR, which is the one case where waiting for
# the weekly batch is wrong.

version: 2
updates:
  # requirements.txt, requirements-dev.txt and pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Majors are deliberately NOT in here. Every pin in requirements.txt
      # carries a paragraph on what was checked before it moved - websockets
      # 16.1 -> 17.0.1 names the renamed kwargs it verified and 16.1 as the
      # rollback - and that review does not survive being bundled with four
      # unrelated bumps. Minors and patches get the one weekly PR.
      python-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned to a commit on TzurSoffer's fork, not a PyPI version, and it is
      # the dependency this codebase monkey-patches most heavily
      # (Database/patches.py). requirements.txt says to bump the SHA
      # deliberately with any fallout fixed in the same commit - so no bot
      # rewrites that line.
      - dependency-name: "spotapi"

  # package.json / package-lock.json - dev-only (eslint), never installed into
  # the image, but it is what the Lint workflow runs `npm ci` against.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Same split as pip, for the same reason: eslint is pinned exactly so
      # that a red lint run means someone's change broke something, not that
      # the tool learned a new opinion overnight (see .github/workflows/lint.yml).
      # A major there can add rules, so it gets its own PR.
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The Dockerfile's `FROM python:<version>-slim`. No group: one image is
  # already one pull request, and the test asserts that count rather than
  # exempting docker by name - a multi-stage build adding a second base image
  # turns red there.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The base image is not a dependency, it is the interpreter this code
      # runs on - and moving it is a multi-file change no bot can make. CI pins
      # `python-version:` to match (tests/test_python_version_alignment.py
      # asserts it), and none of the docker* workflows run on a pull request,
      # so a lone Dockerfile bump ships a Python the suite never executed.
      #
      # Note the vocabulary differs from `groups.update-types` above: an ignore
      # takes the `version-update:semver-*` spelling. Since the tag carries no
      # patch component (`3.14-slim`, not `3.14.2-slim`), ignoring major and
      # minor means Dependabot proposes nothing here at all - which is the
      # intent. Bump it by hand, with the CI pins in the same commit.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # The `uses:` refs in .github/workflows/. Directory is "/" - Dependabot finds
  # the workflows itself and does not take a path to them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # No update-types filter here, unlike pip and npm. An action is pinned to
      # its major tag (actions/checkout@v7), so v7 -> v8 is the ONLY update
      # Dependabot ever proposes for it - filtering majors out would group
      # nothing and leave one PR per action, which is the thing this avoids.
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
