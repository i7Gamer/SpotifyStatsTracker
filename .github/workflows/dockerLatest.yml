name: Docker push latest

on:
  workflow_dispatch: # Enables the manual "Run workflow" button in GitHub UI

permissions:
  contents: read

jobs:
  publish:
    # Build, health-check and publish for amd64 and arm64 - see dockerPublish.yml
    # for why that is a matrix of native runners rather than one buildx call.
    uses: ./.github/workflows/dockerPublish.yml
    with:
      tag: latest
    #< named rather than `secrets: inherit`, so this passes exactly the two it
    #  needs and adding a third to the repository does not silently widen it
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
