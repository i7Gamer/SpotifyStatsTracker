name: Lint

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lint only reads the checkout; nothing here comments on PRs or writes back to
# the repository, so the token is pinned to the minimum rather than inheriting
# the repository default, which can be write-all.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Pinned: a ruff upgrade can add checks to the selected rule groups, and
      # this gate is only useful if going red means someone's change broke
      # something - not that the tool learned a new opinion overnight. Bump it
      # deliberately, with any new findings fixed in the same commit.
      - name: Install ruff
        run: pip install ruff==0.16.0

      # Rule set and the reasoning behind it live in pyproject.toml.
      - name: Lint Python
        run: ruff check .

      # The browser scripts in static/js never run under pytest, so a plain
      # ReferenceError in one of them could only be found by loading the page -
      # and one shipped in a release (see eslint.config.js). Same version-pinning
      # reasoning as ruff above.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install eslint
        run: npm ci

      # Rule set and the reasoning behind it live in eslint.config.js.
      - name: Lint JavaScript
        run: npm run lint
