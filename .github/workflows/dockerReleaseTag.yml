name: Docker push tag

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Exact tag to build (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    # The tag names both what to check out and what to publish. It reaches no
    # shell as an expression - dockerPublish.yml passes it through env: - which
    # is what tests/test_workflow_shell_injection.py exists to keep true: this
    # workflow's first step logs in to Docker Hub, so ~/.docker/config.json
    # holds a live push token by the time any injected command would run.
    uses: ./.github/workflows/dockerPublish.yml
    with:
      tag: ${{ inputs.target_tag }}
      ref: ${{ inputs.target_tag }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
