<div class="tag-widget" data-entity-type="{{ entity_type }}" data-entity-id="{{ entity_id }}" style="margin: 1rem 0; padding: 0.75rem 1rem; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color, #2d2d2d); border-radius: 8px;">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;" class="tag-chips-container">
      <span style="font-size: 0.9rem; font-weight: bold; color: var(--text-muted, #888888);">Tags:</span>
      {% if entity_tags %}
        {% for t in entity_tags %}
          <span class="tag-chip" data-tag="{{ t }}" style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; background: rgba(251, 113, 123, 0.15); color: var(--accent-color, #fb717b); font-size: 0.85rem;">
            #{{ t }}
            <button type="button" class="btn-remove-tag" data-tag="{{ t }}" style="background: none; border: none; color: inherit; cursor: pointer; padding: 0 2px; font-weight: bold;">&times;</button>
          </span>
        {% endfor %}
      {% else %}
        <span class="no-tags-text" style="font-size: 0.85rem; color: var(--text-muted, #888888); italic;">No tags added yet</span>
      {% endif %}
    </div>
    <form class="form-add-tag" style="display: flex; gap: 6px; align-items: center; margin: 0;">
      <input type="text" class="input-new-tag" placeholder="Add tag (e.g. workout)" style="padding: 4px 8px; font-size: 0.85rem; border-radius: 4px; border: 1px solid var(--border-color, #444); background: rgba(0,0,0,0.2); color: inherit; width: 160px;">
      <button type="submit" class="button button-small" style="padding: 4px 10px; font-size: 0.85rem;">+ Tag</button>
    </form>
  </div>
</div>
